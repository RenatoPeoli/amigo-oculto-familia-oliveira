
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Oculto - Família Oliveira</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff7f2;
color:#7f1d1d;
}
.container{
max-width:500px;
margin:35px auto;
padding:20px;
}
.card{
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 8px 30px rgba(127,29,29,.12);
}
.header{
background:linear-gradient(135deg,#b91c1c,#7f1d1d);
color:white;
text-align:center;
padding:28px 20px;
border-radius:22px;
margin-bottom:20px;
}
.header h1{margin:10px 0;font-size:30px}
.header p{margin:0}
input,textarea,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
font-size:16px;
}
input,textarea{
border:1px solid #ead5cd;
background:#fffaf7;
}
button{
border:none;
background:#b91c1c;
color:white;
font-weight:bold;
cursor:pointer;
}
button:hover{background:#991b1b}
.secondary{
background:white;
border:1px solid #b91c1c;
color:#b91c1c;
}
.hidden{display:none}
.small{text-align:center;font-size:14px}
.gift{
background:#fce7d6;
border-radius:15px;
padding:15px;
text-align:center;
margin:15px 0;
}
h2{color:#991b1b}
.message{
padding:12px;
border-radius:10px;
margin:10px 0;
background:#fce7d6;
}
footer{
text-align:center;
margin-top:20px;
font-size:13px;
color:#9a5a50;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<div style="font-size:35px">🎄🎁🎄</div>
<h1>Amigo Oculto</h1>
<p>Família Oliveira</p>
<p style="margin-top:12px">A surpresa mais divertida do Natal! ❤️</p>
</div>

<div class="gift">
<strong>🎁 Valor sugerido</strong>
<h2 id="giftValue">R$ 150,00</h2>
</div>

<div class="card" id="authArea">
<h2 id="authTitle">Entrar</h2>

<div id="registerFields" class="hidden">
<input id="name" placeholder="Nome completo">
<input id="whatsapp" placeholder="WhatsApp com DDD">
</div>

<input id="email" type="email" placeholder="Seu e-mail">
<input id="password" type="password" placeholder="Sua senha">

<button id="mainButton" onclick="authenticate()">Entrar</button>

<button class="secondary" onclick="toggleMode()" id="toggleButton">
Criar conta
</button>

<div id="authMessage" class="message hidden"></div>
</div>

<div class="card hidden" id="userArea">
<h2 id="welcome"></h2>

<div id="resultArea" class="message">
🎁 O resultado do sorteio aparecerá aqui quando o sorteio for realizado.
</div>

<h3>📝 Minha lista de presentes</h3>
<textarea id="suggestions" rows="5"
placeholder="Escreva aqui sugestões de presentes que você gostaria de ganhar..."></textarea>

<button onclick="saveSuggestions()">Salvar sugestões</button>

<div id="userMessage" class="message hidden"></div>

<button class="secondary" onclick="logout()">Sair</button>
</div>

<footer>
🎄 Um Natal cheio de carinho para a Família Oliveira 🎄
</footer>

</div>

<script>
const SUPABASE_URL = "https://xyulquaefsmxocpqitcu.supabase.co";
const SUPABASE_KEY = "sb_publishable_XRfPUDevBsWifVzH54UvVQ_yDfbyx-i";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let isRegister = false;
let currentUser = null;

function toggleMode(){
isRegister = !isRegister;
document.getElementById("registerFields").classList.toggle("hidden",!isRegister);
document.getElementById("authTitle").textContent =
isRegister ? "Criar conta" : "Entrar";
document.getElementById("mainButton").textContent =
isRegister ? "Criar conta" : "Entrar";
document.getElementById("toggleButton").textContent =
isRegister ? "Já tenho conta - Entrar" : "Criar conta";
hideMessage("authMessage");
}

function showMessage(id,text){
const el=document.getElementById(id);
el.textContent=text;
el.classList.remove("hidden");
}

function hideMessage(id){
document.getElementById(id).classList.add("hidden");
}

async function authenticate(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("authMessage");

hideMessage("authMessage");

if(!email || !password){
showMessage("authMessage","Preencha e-mail e senha.");
return;
}

if(isRegister){
const name=document.getElementById("name").value.trim();
const whatsapp=document.getElementById("whatsapp").value.trim();

if(!name || !whatsapp){
showMessage("authMessage","Preencha seu nome e WhatsApp.");
return;
}

const {data,error}=await supabaseClient.auth.signUp({
email,
password,
options:{
data:{
display_name:name,
whatsapp:whatsapp
}
}
});

if(error){
showMessage("authMessage",error.message);
return;
}

showMessage("authMessage",
"Cadastro realizado! Se solicitado, confirme seu e-mail. Depois faça seu login.");
return;

}else{
const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
showMessage("authMessage",error.message);
return;
}

currentUser=data.user;
await loadUser();
}
}

async function loadUser(){
if(!currentUser){
const {data}=await supabaseClient.auth.getUser();
currentUser=data.user;
}

if(!currentUser)return;

document.getElementById("authArea").classList.add("hidden");
document.getElementById("userArea").classList.remove("hidden");

const name=currentUser.user_metadata?.display_name || currentUser.email;
document.getElementById("welcome").textContent="Olá, "+name+"! ❤️";

await loadSuggestions();
await loadResult();
await loadSettings();
}

async function loadSuggestions(){
const {data,error}=await supabaseClient
.from("gift_suggestions")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();

if(data){
document.getElementById("suggestions").value=data.description || "";
}
}

async function saveSuggestions(){
const description=document.getElementById("suggestions").value.trim();

const {data:existing}=await supabaseClient
.from("gift_suggestions")
.select("id")
.eq("user_id",currentUser.id)
.maybeSingle();

let response;

if(existing){
response=await supabaseClient
.from("gift_suggestions")
.update({description,updated_at:new Date().toISOString()})
.eq("user_id",currentUser.id);
}else{
response=await supabaseClient
.from("gift_suggestions")
.insert({user_id:currentUser.id,description});
}

if(response.error){
showMessage("userMessage","Erro ao salvar: "+response.error.message);
}else{
showMessage("userMessage","Sugestões salvas com sucesso! 🎁");
}
}

async function loadResult(){
const {data,error}=await supabaseClient
.from("draw_results")
.select("receiver_id")
.eq("giver_id",currentUser.id)
.maybeSingle();

const area=document.getElementById("resultArea");

if(error){
area.textContent="O sorteio ainda não está disponível.";
return;
}

if(!data){
area.textContent="🎁 O resultado do sorteio aparecerá aqui quando ele for realizado.";
return;
}

const {data:profile,error:profileError}=await supabaseClient
.from("profiles")
.select("display_name")
.eq("id",data.receiver_id)
.maybeSingle();

if(profile && profile.display_name){
area.innerHTML="";
const title=document.createElement("strong");
title.textContent="🎉 Você tirou:";
const name=document.createElement("h2");
name.textContent=profile.display_name;
area.append(title,name);
}else{
area.textContent="Seu sorteio foi realizado!";
}
}

async function loadSettings(){
const {data}=await supabaseClient
.from("event_settings")
.select("gift_value,event_name")
.eq("id",1)
.maybeSingle();

if(data){
document.getElementById("giftValue").textContent=
"R$ "+Number(data.gift_value).toFixed(2).replace(".",",");
}
}

async function logout(){
await supabaseClient.auth.signOut();
currentUser=null;
document.getElementById("userArea").classList.add("hidden");
document.getElementById("authArea").classList.remove("hidden");
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
if(session && !currentUser){
currentUser=session.user;
}
});

</script>
</body>
</html>
